[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oraculo-termux"
version = "1.0.0"
description = "Agente de IA 100% offline para Android (Termux)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ORÁCULO Project", email = "oraculo@example.com"}
]
maintainers = [
    {name = "ORÁCULO Project", email = "oraculo@example.com"}
]
keywords = [
    "ai", "assistant", "offline", "android", "termux", "voice", "llm", "stt", "tts"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Home Automation",
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.2.90"]
stt = ["vosk>=0.3.45"]
tts = ["piper-tts>=1.2.0", "sherpa-onnx>=1.10.0"]
vector = ["sqlite-vec>=0.1.6", "onnxruntime>=1.17.0"]
automation = ["pure-python-adb>=0.2.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "buildozer>=1.5.0",
    "cython>=3.0.0",
]
all = [
    "llama-cpp-python>=0.2.90",
    "vosk>=0.3.45",
    "piper-tts>=1.2.0",
    "sherpa-onnx>=1.10.0",
    "sqlite-vec>=0.1.6",
    "onnxruntime>=1.17.0",
    "pure-python-adb>=0.2.0",
]

[project.entry-points]
console_scripts = [
    "oraculo = oraculo.main:main",
]

[project.urls]
Homepage = "https://github.com/SEU_USUARIO/oraculo-termux"
Repository = "https://github.com/SEU_USUARIO/oraculo-termux"
Issues = "https://github.com/SEU_USUARIO/oraculo-termux/issues"
Documentation = "https://github.com/SEU_USUARIO/oraculo-termux/wiki"

[tool.setuptools.packages.find]
include = ["oraculo*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "DTZ", "T20", "ARG", "PTH", "ERA", "PL", "TRY", "NPY", "PD", "RET", "SIM", "TCH", "INP", "PIE", "FLY", "LOG"]
ignore = ["S101", "S311", "S603", "S607"]
exclude = ["models/", ".buildozer/", "bin/", "__pycache__/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
namespace_packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "requires_model: marks tests that require downloaded models",
]

[tool.coverage.run]
source = ["oraculo"]
omit = ["tests/*", "setup.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]